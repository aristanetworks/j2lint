---
# Run with prek: https://prek.j178.dev/
# Keep YAML so Renovate's pre-commit manager can update hooks and dependencies.
# See https://pre-commit.com/hooks.html for more hooks
files: ^(j2lint|tests|\.github)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # exclude_types: [jinja, text]
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8  # frozen: v1.5.6
    hooks:
      - name: Check and insert license on Python files
        id: insert-license
        files: .*\.py$
        args:
          - --license-filepath
          - .github/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --no-extra-eol

      - name: Check and insert license on Jinja2 files
        id: insert-license
        files: .*\.j2$
        args:
          - --license-filepath
          - .github/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --comment-style
          - "{#||#}"
          - --no-extra-eol

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff
        name: Run Ruff linter
        args: [--fix]
      - id: ruff-format
        name: Run Ruff formatter

  - repo: https://github.com/pycqa/pylint
    rev: e75de10c69103381c875601f638d4b977ff0fcaf  # frozen: v4.1.3
    hooks:
      - id: pylint
        name: Check for Linting error on Python files
        description: This hook runs pylint.
        types: [python]
        language: python
        args:
          - -rn # Only display messages
          - -sn # Don't display the score
          - --rcfile=pyproject.toml # Link to config file
          # Suppress duplicate code for modules header
          - -d duplicate-code
        additional_dependencies:
          - jinja2==3.1.6
          - rich==15.0.0
          - pytest==9.1.1
          - typing_extensions==4.16.0

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 1aa6dfeb849ae43fb6f16fc17228bcbd358a19c3  # frozen: v1.1.414
    hooks:
      - id: pyright
        name: PyRight static type checker
        types: [python]
        language: python
        additional_dependencies:
          - jinja2==3.1.6
          - rich==15.0.0
          - pytest==9.1.1
          - typing_extensions==4.16.0

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        name: Checks for common misspellings in text files.
        entry: codespell
        language: python
        types: [text]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        name: Check GitHub Actions with zizmor
        files: ^\.github/
        pass_filenames: false
        args: ["--fix", ".github"]
