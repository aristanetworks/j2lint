---
# Run with prek: https://prek.j178.dev/
# Keep YAML so Renovate's pre-commit manager can update hooks and dependencies.
# See https://pre-commit.com/hooks.html for more hooks
files: ^(j2lint|tests|\.github)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # exclude_types: [jinja, text]
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8  # frozen: v1.5.6
    hooks:
      - name: Check and insert license on Python files
        id: insert-license
        files: .*\.py$
        args:
          - --license-filepath
          - .github/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --no-extra-eol

      - name: Check and insert license on Jinja2 files
        id: insert-license
        files: .*\.j2$
        args:
          - --license-filepath
          - .github/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --comment-style
          - "{#||#}"
          - --no-extra-eol

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff
        name: Run Ruff linter
        args: [--fix]
      - id: ruff-format
        name: Run Ruff formatter

  - repo: https://github.com/pycqa/pylint
    rev: edc8e376ba4affd43bc07571bdf3a90efc281ba7  # frozen: v4.1.4
    hooks:
      - id: pylint
        name: Check for Linting error on Python files
        description: This hook runs pylint.
        types: [python]
        language: python
        # Keep files together so duplicate-code checks can compare them.
        require_serial: true
        args:
          - -rn # Only display messages
          - -sn # Don't display the score
          - --rcfile=pyproject.toml # Link to config file
        additional_dependencies:
          - jinja2==3.1.6
          - rich==15.0.0
          - pytest==9.2.0
          - typing_extensions==4.16.0
          - pytest-codspeed==5.0.4

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 53d9c26363b275be71a9342a87d55c0d1825cc06  # frozen: v0.0.107
    hooks:
      - id: ty
        args: [--locked, --isolated, --no-default-groups, --group=type, --group=test, --group=benchmark]

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        name: Checks for common misspellings in text files.
        entry: codespell
        language: python
        types: [text]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        name: Check GitHub Actions with zizmor
        files: ^\.github/
        pass_filenames: false
        args: ["--fix", ".github"]
