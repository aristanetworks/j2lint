---
name: Run benchmarks
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Benchmark j2lint for Python 3.12
    # CodSpeed runner 5.2.1 does not support the Ubuntu 26.04 image selected by ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install "pip>=25.1"
      - name: Install dependencies
        run: python -m pip install . --group test --group benchmark
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
          run: pytest --codspeed --no-cov -o addopts= -q tests/benchmark
