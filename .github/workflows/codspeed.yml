---
name: Run benchmarks
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Benchmark j2lint for Python 3.12
    # CodSpeed runner 5.2.1 does not support the Ubuntu 26.04 image selected by ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install "pip>=25.1"
      - name: Install dependencies
        run: python -m pip install . --group test --group benchmark
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: pytest --codspeed --no-cov -o addopts= -q tests/benchmark
