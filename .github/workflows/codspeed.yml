---
name: Run benchmarks
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Benchmark j2lint for Python 3.12
    # CodSpeed runner 5.2.1 does not support the Ubuntu 26.04 image selected by ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --no-default-groups --no-editable --group test --group benchmark
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
          run: uv run --no-sync python -m pytest --codspeed --no-cov -o addopts= -q tests/benchmark
