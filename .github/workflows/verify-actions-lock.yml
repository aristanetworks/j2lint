---
name: Verify action lockfile

"on":
  pull_request:
  push:
    branches:
      - devel

permissions:
  contents: read

jobs:
  verify:
    name: Verify action lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify workflow dependencies and provenance
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
