---
name: Code Testing
"on":
  push:
    branches:
      - devel
  pull_request:

permissions:
  contents: read

jobs:
  test-locked-dependencies:
    name: Pytest with locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run tests with locked dependencies
        run: uv run --no-sync python -m pytest --no-cov
  github-annotations:
    name: Verify GitHub annotations (intentional findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --no-default-groups
      - name: Emit an intentional error and warning annotation
        run: |
          status=0
          uv run --no-sync j2lint --output-format github --warn V1 -- tests/data/github-annotations.j2 || status=$?
          if [ "$status" -ne 2 ]; then
            echo "Expected exit code 2 for the intentional S1 violation, got $status" >&2
            exit 1
          fi
  tox:
    name: Run pytest for supported Python versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            tox-env: "py311"
          - python: "3.12"
            tox-env: "py312"
          - python: "3.13"
            tox-env: "py313"
          - python: "3.14"
            tox-env: "py314"
          - python: "3.15"
            tox-env: "clean,py315,report"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run tox for ${{ matrix.python }}"
        run: tox -e ${{ matrix.tox-env }}
      - name: Upload coverage from pytest
        # Coverage only runs as part of 3.15.
        if: |
          matrix.python == '3.15'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pytest-coverage
          path: ${{ github.workspace }}/coverage.xml
  benchmarks:
    name: Benchmark j2lint for Python 3.12
    needs: [tox]
    if: github.repository == 'aristanetworks/j2lint'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codspeed.yml
  codecov:
    name: Upload coverage to codecov
    needs: [tox]
    if: github.repository == 'aristanetworks/j2lint'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codecov.yml
