---
name: Code Testing
"on":
  push:
    branches:
      - devel
  pull_request:

jobs:
  lint:
    name: Run pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run lint"
        run: tox -e lint
  type:
    name: Run pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run pyright"
        run: tox -e type
  tox:
    name: Run pytest for supported Python versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            tox-env: "py310"
          - python: "3.11"
            tox-env: "py311"
          - python: "3.12"
            tox-env: "py312"
          - python: "3.13"
            tox-env: "clean,py313,report"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run tox for ${{ matrix.python }}"
        run: tox -e ${{ matrix.tox-env }}
      - name: Upload coverage from pytest
        # Coverage only runs as part of 3.13.
        if: |
          matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage
          path: ${{ github.workspace }}/coverage.xml
  codecov:
    name: Upload coverage to codecov
    needs: [tox]
    if: github.repository == 'aristanetworks/j2lint'
    uses: ./.github/workflows/codecov.yml
