---
name: Code Testing
"on":
  push:
    branches:
      - devel
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run lint"
        run: tox -e lint
  type:
    name: Run pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run pyright"
        run: tox -e type
  tox:
    name: Run pytest for supported Python versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            tox-env: "py310"
          - python: "3.11"
            tox-env: "py311"
          - python: "3.12"
            tox-env: "py312"
          - python: "3.13"
            tox-env: "py313"
          - python: "3.14"
            tox-env: "py314"
          - python: "3.15"
            tox-env: "clean,py315,report"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install --group ci
      - name: "Run tox for ${{ matrix.python }}"
        run: tox -e ${{ matrix.tox-env }}
      - name: Upload coverage from pytest
        # Coverage only runs as part of 3.15.
        if: |
          matrix.python == '3.15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-coverage
          path: ${{ github.workspace }}/coverage.xml
  codecov:
    name: Upload coverage to codecov
    needs: [tox]
    if: github.repository == 'aristanetworks/j2lint'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codecov.yml
