---
name: "Label for Release Notes"

"on":
  pull_request_target: # zizmor: ignore[dangerous-triggers] Runs after merge or title edits and only uses trusted base-branch action code to maintain release-note labels.
    types:
      - closed
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  if_merged:
    name: "PR was merged"
    if: github.event.pull_request.merged == true && (github.event.action == 'closed' || (github.event.action == 'edited' && github.event.changes.title != null))
    uses: aristanetworks/avd/.github/workflows/release-note-labeler.yml@6867159b26356ca5a03e267bf9f8db01ff862b14 # v6.5.0
    with:
      auto_create_label: true
