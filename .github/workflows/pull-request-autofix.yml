---
name: autofix.ci

"on":
  pull_request:
  push:
    branches:
      - devel

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: Run prek and commit back any changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install prek
        run: python -m pip install --group hooks

      - name: Run prek fixers
        id: fixes
        continue-on-error: true
        run: prek run --group fix --all-files --show-diff-on-failure --color=always

      # This action fails when it submits fixes, deferring checks to the fix commit.
      - name: Commit back any git diff
        uses: autofix-ci/action@v1.3.4

      - name: Run prek checks
        run: prek run --group check --all-files --color=always
        env:
          RUFF_OUTPUT_FORMAT: github
          TY_OUTPUT_FORMAT: github

      - name: Fail if a fixer failed
        if: always() && steps.fixes.outcome == 'failure'
        run: |
          echo "A fixer failed or modified files; see its diagnostics above."
          exit 1
