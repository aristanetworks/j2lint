---
name: autofix.ci

"on":
  pull_request:
  push:
    branches:
      - devel

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: Run prek and commit back any changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install prek
        run: python -m pip install --group hooks

      # Autofixes can shift annotation lines relative to the triggering commit.
      # A follow-up run with no further edits reports remaining errors on the correct lines.
      - name: Run prek autofix pass
        id: prek
        continue-on-error: true
        env:
          RUFF_OUTPUT_FORMAT: github
          TY_OUTPUT_FORMAT: github
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Commit back any git diff
        uses: autofix-ci/action@v1.3.4

      - name: Fail if checks failed
        if: steps.prek.outcome == 'failure'
        run: |
          echo "prek failed or modified files; see the hook diagnostics above."
          echo "Submitted fixes must pass a new run."
          exit 1
