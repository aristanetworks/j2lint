---
name: autofix.ci

"on":
  pull_request:
  push:
    branches:
      - devel

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    name: Run prek and commit back any changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install prek
        run: python -m pip install --group hooks

      # Emit annotations before any hook can change source line numbers.
      - name: Check Ruff and ty without fixes
        id: checks
        continue-on-error: true
        env:
          RUFF_OUTPUT_FORMAT: github
          TY_OUTPUT_FORMAT: github
        run: prek run ruff-check-ci ty --stage manual --all-files --color=always

      - name: Run prek autofix pass
        id: prek
        continue-on-error: true
        run: prek run --all-files --skip ty --show-diff-on-failure --color=always

      - name: Fail if prek failed without fixes
        if: steps.prek.outcome == 'failure'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "prek failed and did not produce changes for autofix.ci to commit."
            exit 1
          fi

      - name: Commit back any git diff
        uses: autofix-ci/action@v1.3.4

      - name: Fail if Ruff or type checking failed
        if: always() && steps.checks.outcome == 'failure'
        run: |
          echo "Ruff or ty failed; see the read-only check step for diagnostics."
          exit 1
